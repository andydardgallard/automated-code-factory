# Business task template for the Code Factory
# Fill in ONLY business terms — no code details needed.
# Only `title` and `description` are required.
# NOTE: there is NO priority field — every task is treated as HIGH priority by default.

title: "Short business goal, e.g.: Strategy works wrong for CNY instrument — no trading signals"

# Path to an existing repository. Omit for brand-new projects.
repo_path: ./repo

# Business description — plain language, no technical jargon.
description: |
  Describe the problem or the desired feature as a business person would.
  Examples:
  - "The trading strategy stops generating signals for the CNY instrument.
     It should work the same way it does for the Si instrument."
  - "Build a service that prepares the monthly sales report and emails it."
  - "Add a page where the manager can see the current warehouse balance."
  The factory will analyze the code and decide how to implement it.

# Optional but strongly recommended: a user story that captures WHO needs WHAT and WHY.
# Written from the end user's perspective. The factory reads and uses this context at the
# analysis, planning and implementation stages to make better decisions.
# user_story: |
#   As a <who>, I want <what> so that <business value>.
#   Example:
#   As a trader, I want the CNY strategy to generate signals so that I can trade the
#   fractional-price instrument the same way I trade Si.

# Mode: hitl = human-in-the-loop (default, the factory will ask you business
# questions and show the plan for approval) | auto = the factory skips those
# business questions and records assumptions instead.
#
# NOTE: `mode: auto` controls ONLY the factory's business questions. It does NOT
# control Kimi Code CLI's tool-approval prompts. For a fully unattended run,
# launch with `kimi --auto` (or `--yolo`), or set
# `default_permission_mode = "auto"` in ~/.kimi-code/config.toml.
mode: hitl

# Task type:
#   implement       = write/change code to solve a business task (default)
#   review          = the deliverable is a code review of the existing codebase
#   refactor        = improve structure / reduce tech debt WITHOUT changing behavior
#                     (100% of existing tests must pass unchanged)
#   security_audit  = full security audit of the project; produces reports + a fix-task file
task_type: implement

# What success looks like — in business terms, things you will personally check.
# У критерия может быть МАШИННАЯ проверка (опционально):
#   criterion — формулировка на бизнес-языке (обязательная часть)
#   verify    — команда, которая РЕАЛЬНО выполняется; её exit code и выдержка вывода
#               попадают в .code-factory/state/acceptance.md
#   derived   — true помечает критерий, выведенный из других артефактов (без verify):
#               доказательством он не считается и помечается derived/unverified
acceptance_criteria:
  - "Criterion 1, e.g.: The strategy generates at least 5 LONG/SHORT signals for CNY."
  - criterion: "Criterion 2, e.g.: Behavior for the Si instrument did not change."
    verify: "python -m pytest -q tests/test_si_regression.py"
  - criterion: "Criterion 3, e.g.: The report lists the CNY instrument."
    derived: true

# Optional: business test scenarios. If omitted, the factory will ask you about
# them at the planning stage (in hitl mode).
# business_tests:                    # сценарий, конфиги и ожидаемые бизнес-результаты
#   - scenario: "Run the strategy on the CNY data file"
#     config: "path/to/config.toml"
#     expected_results: "At least 5 LONG/SHORT signals and a positive equity curve"

# Optional: external knowledge for THIS task — books/documents (PDF, EPUB, DOCX,
# Markdown, HTML, folders) converted into reusable skills and stored in the
# persistent skill-base/. `reference_docs` = {path, skill} to generate/update/reuse;
# `reference_skills` = names of existing skills to reuse without a path (a missing
# name is an error asking for the path in reference_docs).
# reference_docs:
#   - path: "docs/market-making-book.pdf"
#     skill: "market-making"
# reference_skills:
#   - "market-making"

# Optional: override the default models per role. Any model available to your
# provider works, including Kimi (e.g. kimi-k3 / moonshot) and Qwen models.
# The factory maps the provider from the model name and routes requests to the
# correct endpoint with the right authentication (see references/providers.md).
# models:
#   analyzer: deepseek-v4-flash
#   planner: deepseek-v4-pro
#   coder: kimi-k3
#   tester: qwen-max
#   diagnostician: deepseek-v4-pro
#   reviewer: deepseek-v4-pro

# Optional: files that must NOT be committed to git (e.g. personal strategy code).
# Glob patterns relative to the repo root. The factory will make changes to these files
# (backups, tests, rollback) but will exclude them from the git commit.
# commit_exclude:
#   - "strategy_lib/src/SYMI_Ch_SMA_up_lmt.rs"
#   - "strategy_lib/**"

# NOTE: you do NOT need to update the factory version manually — after every successful
# implement/refactor run the factory picks the version type (major/minor/patch/none) via a
# deterministic matrix, has the reviewer validate it, and syncs the version everywhere.
# review / security_audit tasks never change the version.

