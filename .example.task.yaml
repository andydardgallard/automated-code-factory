# =============================================================================
# EXAMPLE TASK FILE for the Autonomous Code Factory
# =============================================================================
# Copy this file to `task.yaml` (or to any other name, e.g.
# `my-task.yaml`) and fill in the fields with your own values. Do not edit
# `.example.task.yaml` itself.
#
# Required fields:  `title`, `repo_path`, `description`.
# `repo_path` is REQUIRED for every task except a green-field one (a brand-new
# project created in place); a missing required field is a task parsing error,
# not a reason to guess the value mid-run.
#
# Optional fields: `user_story`, `mode`, `task_type`, `acceptance_criteria`,
# `business_tests`, `reference_docs`, `reference_skills`, `commit_exclude`,
# `models` (all documented below; the factory has sensible defaults).
#
# Important: the task file MUST NOT contain secrets or personal data.
#
# There is NO `priority` field in the task format: by default absolutely all
# tasks are handled by the factory with the highest priority (high).
# =============================================================================

# --- Short task title (1 sentence, business language) ------------------------
# Required field.
title: "Short goal, e.g.: The strategy does not generate signals for CNY"

# --- Path to an existing repository (for projects that already exist) --------
# Required, EXCEPT for a green-field task (a brand-new project created in place):
# only then may it be deleted or left empty.
# The path may be relative (to the folder where the factory is launched) or absolute;
# it is resolved once to an absolute path at the start of the run.
repo_path: ./repo

# --- Task description (business language, no technical details) --------------
# Required field. Multi-line (use | for a text block).
description: |
  Describe the problem or the desired functionality the way a business
  user unfamiliar with programming would describe it.

  Examples:
  - "The trading strategy stopped generating signals for the CNY instrument.
     It should work the same way it does for the Si instrument."
  - "Build a service that prepares the monthly sales report and
     sends it by email."
  - "Add a page where the manager sees the current warehouse balance."

  The factory will study the project code itself and decide how to implement the task.

# --- User story (user scenario) ----------------------------------------------
# Optional, but strongly recommended. Helps the factory understand the
# business need more deeply. Written from the end user's perspective.
# The factory analyzes and uses this context at the analysis, planning
# and implementation stages.
user_story: |
  As a <who>, I want <what>, so that <business value>.
  Example:
  As a trader, I want the strategy to generate signals for CNY,
  so that I can trade the fractional instrument the same way I trade Si.

# --- Operating mode -----------------------------------------------------------
# Optional. Allowed:
#   hitl (default) — the factory asks clarifying business questions and shows
#                    the plan for approval before implementation.
#   auto           — the factory does NOT ask business questions and does NOT show
#                    the plan for approval, but makes reasonable assumptions
#                    (they are recorded in the plan).
#
# IMPORTANT: `mode: auto` controls ONLY the factory's questions (business logic).
# The tool-permission prompts (Bash/Write/Edit etc.) are a separate
# permission mode of Kimi Code CLI. For the factory to work with no
# permission prompts at all, launch `kimi --auto` (or `--yolo`), or set
# `default_permission_mode = "auto"` in ~/.kimi-code/config.toml.
mode: hitl

# --- Task type ----------------------------------------------------------------
# Optional. Allowed:
#   implement (default) — write/change code to solve the business task.
#   review              — REPORT-ONLY. The deliverable is a code review of the
#                         existing code: the factory runs the reviewer over ALL
#                         the code and stops there — it delivers the report plus a
#                         generated follow-up task file
#                         (.code-factory/review/fix-tasks.yaml, produced by
#                         scripts/review_followup_task.py) that YOU run later as a
#                         separate implement task. A review never edits the tree,
#                         so a review task's `verify:` criteria must be
#                         satisfiable on the UNMODIFIED tree — a criterion that
#                         needs a code change is an authoring error, not work for
#                         the run (the same guarantee security_audit has).
#   refactor            — tech-debt/duplication reduction / architecture simplification
#                         WITHOUT changing behavior: 100% of the existing tests
#                         must pass unchanged, otherwise — automatic rollback.
#   security_audit      — a full cybersecurity audit of the project (adaptive,
#                         by artifact types). The result is reports + a fix-task
#                         file. The factory does NOT fix vulnerabilities itself.
task_type: implement

# --- Acceptance criteria (what counts as success) ----------------------------
# Optional. A list of business criteria the user will be able to check
# personally after completion. A criterion is either a plain string or an object
# with `criterion` plus an optional machine check:
#   verify  — a one-line command the factory executes FOR REAL; its exit code and
#             an output excerpt land in .code-factory/state/acceptance.md.
#   derived — true marks a criterion derived from other artifacts (no `verify`):
#             it is labeled derived/unverified and is NOT acceptance evidence.
# The factory confirms every criterion with evidence, i.e. every criterion that
# carries `verify`; a criterion without `verify` is only derived/unverified.
# For `task_type: review` the criteria must hold on the UNMODIFIED tree (the run is
# report-only and may not change code to satisfy itself) — a review criterion that
# requires a code change is an authoring error.
acceptance_criteria:
  - "Criterion 1, e.g.: The strategy generates at least 5 LONG/SHORT signals for CNY."
  # With `verify`: executed for real, exit code in state/acceptance.md → evidence.
  - criterion: "Criterion 2, e.g.: Behavior for the Si instrument did not change."
    verify: "python -m pytest -q tests/test_si_regression.py"
  # Without `verify` it is `derived`/`unverified` and is not evidence.
  - criterion: "Criterion 3, e.g.: The report lists the CNY instrument."
    derived: true

# --- Business tests (verification scenarios) ---------------------------------
# Optional. If not filled in — the factory will ask the user for them at the
# planning stage (in hitl mode).
# business_tests:
#   - scenario: "Run the strategy on the CNY data"
#     config: "path/to/config.toml"
#     expected_results: "At least 5 LONG/SHORT signals and a positive equity curve"

# --- External knowledge: documents and skills (references for the task) ------
# Optional. Lets you attach books/documents (PDF, EPUB, DOCX, Markdown,
# HTML, folders) as references for a specific task. The factory converts them
# into reusable skills and stores them in the persistent skill-base/ base.
#
# reference_docs — a list of documents for generating/updating a skill.
#   path  — path to the source file or folder.
#   skill — the skill name. On first use the skill is generated; when the same
#           path repeats it is reused (by the SHA256 hash of the content); when
#           the source changes it is updated incrementally.
# reference_skills — names of already created skills to reuse without a path.
#   If a skill is not found in the base — the factory returns an error and asks
#   for the path in reference_docs.
# reference_docs:
#   - path: "docs/market-making-book.pdf"
#     skill: "market-making"
# reference_skills:
#   - "market-making"

# --- Files that must NOT be committed to git ---------------------------------
# Optional. Glob patterns relative to the repository root. The factory may
# change these files (backups/tests/rollback) but will never add them to a commit.
# Useful for personal/private files (e.g. your own strategies).
# commit_exclude:
#   - "strategy_lib/src/SYMI_Ch_SMA_up_lmt.rs"
#   - "strategy_lib/**"

# --- Model overrides per role -------------------------------------------------
# Optional. Lets you override the role models for a specific task.
# Precedence: this matrix wins for every role it names — that exact model is used and
# never substituted, and a generator/judge family collision is only a WARNING
# (`models_warning` in .code-factory/state/pipeline.yaml and report.md, the run
# continues). A role the matrix does NOT name takes its model from the factory's
# default matrix (the CLI config's `default_model` / `[secondary_model]`, selected by
# the role's `model_preference: primary|secondary`), where the generator≠judge rule IS
# enforced: a same-family coder/tester/gui_expert vs reviewer/diagnostician/advisor
# pair is an ERROR naming the fix (widen `[secondary_model]` or pin `models.<role>`).
# Any provider families are supported: deepseek, qwen, kimi/moonshot and others.
# When a Kimi model (e.g. kimi-k3) or Qwen is specified, the factory automatically
# routes requests to the corresponding API endpoint with the correct
# authentication (see .agents/skills/code-factory/references/providers.md).
# models:
#   analyzer: deepseek-v4-flash
#   planner: deepseek-v4-pro
#   coder: kimi-k3
#   gui_expert: deepseek-v4-flash   # Web GUI specialist (generator-side, secondary-class model)
#   tester: qwen-max
#   diagnostician: deepseek-v4-pro
#   reviewer: deepseek-v4-pro

# --- Factory version ----------------------------------------------------------
# You do NOT need to update the factory version manually: after every successful run
# (implement/refactor) the factory itself determines the version type (major/minor/patch/none)
# with a deterministic matrix, agrees it with the code reviewer and syncs the version in all
# files (README, CHANGELOG, AGENTS.md, SKILL.md, the instruction). review and security_audit
# tasks do not change the version.

