# =============================================================================
# EXAMPLE TASK FILE for the Autonomous Code Factory
# =============================================================================
# Скопируйте этот файл в `task.yaml` (или в любое другое имя, например
# `my-task.yaml`) и заполните поля своими значениями. Не редактируйте сам
# `.example.task.yaml`.
#
# Обязательные поля:  `title`, `description`.
# Остальные поля — опциональны (у фабрики есть разумные значения по умолчанию).
#
# Важно: файл задачи НЕ должен содержать секретов и личных данных.
#
# Поля `priority` в формате задачи НЕТ: по умолчанию абсолютно все задачи
# обрабатываются фабрикой с наивысшим приоритетом (high).
# =============================================================================

# --- Краткое название задачи (1 предложение, бизнес-язык) --------------------
# Обязательное поле.
title: "Краткая цель, например: Стратегия не генерирует сигналы для CNY"

# --- Путь к существующему репозиторию (для проектов, которые уже есть) -------
# Опционально. Для нового проекта (green-field) — удалите или оставьте пустым.
# Путь может быть относительным (от папки, где запускается фабрика) или абсолютным.
repo_path: ./repo

# --- Описание задачи (бизнес-язык, без технических деталей) ------------------
# Обязательное поле. Многострочное (используйте | для блока текста).
description: |
  Опишите проблему или желаемую функциональность так, как описал бы её
  бизнес-пользователь, не знакомый с программированием.

  Примеры:
  - "Торговая стратегия перестала генерировать сигналы для инструмента CNY.
     Она должна работать так же, как для инструмента Si."
  - "Создать сервис, который готовит ежемесячный отчёт о продажах и
     отправляет его по электронной почте."
  - "Добавить страницу, на которой менеджер видит текущий остаток на складе."

  Фабрика сама изучит код проекта и решит, как реализовать задачу.

# --- User story (пользовательский сценарий) ----------------------------------
# Опционально, но настоятельно рекомендуется. Помогает фабрике глубже понять
# бизнес-потребность. Пишется от лица конечного пользователя.
# Фабрика анализирует и использует этот контекст на этапах анализа, планирования
# и реализации.
user_story: |
  Как <кто>, я хочу <что>, чтобы <ценность для бизнеса>.
  Пример:
  Как трейдер, я хочу, чтобы стратегия генерировала сигналы для CNY,
  чтобы я мог торговать дробным инструментом так же, как торгую Si.

# --- Режим работы -------------------------------------------------------------
# Опционально. Допустимо:
#   hitl (по умолчанию) — фабрика задаёт уточняющие бизнес-вопросы и показывает
#                          план на согласование перед реализацией.
#   auto                — фабрика НЕ задаёт бизнес-вопросы и НЕ показывает план
#                          на согласование, а принимает разумные допущения
#                          (они фиксируются в плане).
#
# ВАЖНО: `mode: auto` управляет ТОЛЬКО вопросами фабрики (бизнес-логикой).
# Запросы разрешения на выполнение инструментов (Bash/Write/Edit и т.д.) — это
# отдельный режим разрешений Kimi Code CLI. Чтобы фабрика работала вообще без
# запросов разрешения, запускайте `kimi --auto` (или `--yolo`), либо задайте
# `default_permission_mode = "auto"` в ~/.kimi-code/config.toml.
mode: hitl

# --- Тип задачи ---------------------------------------------------------------
# Опционально. Допустимо:
#   implement (по умолчанию) — написать/изменить код для решения бизнес-задачи.
#   review                  — результатом является code review существующего кода.
#                             Фабрика запускает ревьюера по ВСЕМУ коду в начале,
#                             его замечания становятся планом работ.
#   refactor                — снижение техдолга/дублирования/упрощение архитектуры
#                             БЕЗ изменения поведения: 100% существующих тестов
#                             должны пройти без изменений, иначе — автооткат.
#   security_audit          — полный аудит кибербезопасности проекта (адаптивно,
#                             по типам артефактов). Результат — отчёты + файл задач
#                             на исправление. Фабрика НЕ чинит уязвимости сама.
task_type: implement

# --- Критерии приёмки (что считается успехом) --------------------------------
# Опционально. Список бизнес-критериев, которые пользователь сможет проверить
# лично после завершения. Фабрика подтверждает каждый критерий с доказательством.
acceptance_criteria:
  - "Критерий 1, например: Стратегия генерирует не менее 5 сигналов LONG/SHORT для CNY."
  - "Критерий 2, например: Поведение для инструмента Si не изменилось."

# --- Бизнес-тесты (сценарии проверки) ----------------------------------------
# Опционально. Если не заполнить — фабрика уточнит их у пользователя на этапе
# планирования (в режиме hitl).
# business_tests:
#   - scenario: "Запустить стратегию на данных CNY"
#     config: "path/to/config.toml"
#     expected_results: "Не менее 5 сигналов LONG/SHORT и положительная кривая капитала"

# --- Файлы, которые НЕЛЬЗЯ коммитить в git -----------------------------------
# Опционально. Glob-паттерны относительно корня репозитория. Фабрика может
# менять эти файлы (бэкапы/тесты/откат), но никогда не добавит их в коммит.
# Полезно для личных/закрытых файлов (например, собственные стратегии).
# commit_exclude:
#   - "strategy_lib/src/SYMI_Ch_SMA_up_lmt.rs"
#   - "strategy_lib/**"

# --- Переопределение моделей для ролей ---------------------------------------
# Опционально. Позволяет переопределить модели ролей для конкретной задачи.
# Поддерживаются любые семейства провайдера: deepseek, qwen, kimi/moonshot и др.
# При указании модели Kimi (например, kimi-k3) или Qwen фабрика автоматически
# маршрутизирует запросы на соответствующий API-эндпоинт с корректной
# аутентификацией (см. .agents/skills/code-factory/references/providers.md).
# models:
#   analyzer: deepseek-v4-flash
#   planner: deepseek-v4-pro
#   coder: kimi-k3
#   tester: qwen-max
#   diagnostician: deepseek-v4-pro
#   reviewer: deepseek-v4-pro
