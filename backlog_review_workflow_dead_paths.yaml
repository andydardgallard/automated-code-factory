title: "Review workflow: найти и удалить мёртвые пути после обновления Kimi Code (EnterPlanMode и подобное)"

repo_path: .

mode: auto

task_type: review

description: |
  Провести ревью воркфлоу самой фабрики на предмет мёртвых путей/мёртвого кода после
  обновления Kimi Code (сейчас установлен Kimi Code 2.4.1).

  Известный факт (подтверждён по официальной документации продукта, страница
  "Built-in Tools": https://www.kimi.com/code/docs/en/kimi-code-cli/reference/tools.html):
  в текущем Kimi Code plan mode — это режим, который включает ТОЛЬКО пользователь
  (Shift-Tab или /plan), у агента НЕТ инструмента для входа в plan mode; существует только
  `ExitPlanMode` (завершение и предъявление плана). Инструмента `EnterPlanMode` больше нет.

  При этом фабрика в трёх местах предписывает агенту "call EnterPlanMode then ExitPlanMode":
    - .agents/skills/code-factory/SKILL.md (узел I в flowchart, фаза 3 HITL-ветки)
    - .agents/agents/code-factory.md ("Phase 3 — Business tests + approval")
    - .agents/skills/code-factory/references/planning-guide.md (§6 "Present the plan")
  Плюс формулировки в инструкциях проекта (AGENTS.md и аналог README), которые говорят
  оператору "вызывать EnterPlanMode" и/или описывают план-мод как часть автоматики фабрики.

  Фактическое поведение: фабрика всё равно получает утверждение плана — план пишется в
  .code-factory/state/plan.md и предъявляется пользователю через обычный вопрос
  (AskUserQuestion / текстовый вывод), поэтому сам гейт утверждения НЕ теряется. Теряется
  только заявленная механика (план-мод) — воркфлоу деградирует молча.

  WHAT TO DO THIS RUN (review — report-only, ничего в продукте не менять):
  1. Проверить живость у каждого шага потока и у каждой ссылки на инструменты CLI:
     - все ли инструменты, которые упоминает SKILL.md / code-factory.md / sub-agents /
       references (EnterPlanMode, ExitPlanMode, AskUserQuestion, Agent, Skill,
       TodoList, TaskStop, cron-инструменты, AgentSwarm и т.д.) реально существуют в
       установленном Kimi Code 2.4.1; для каждого несуществующего — указать, где он
       упомянут (файл:строка) и чем его заменить по смыслу;
     - нет ли других "мёртвых" ветвей: ссылки на режимы, переменные окружения, флаги CLI,
       ожидания поведения, которых в текущем CLI уже нет.
  2. Проверить, не расходится ли заявленный HITL-гейт утверждения плана с фактическим
     (план-файл + вопрос об утверждении) — и как это должно быть описано, чтобы фабрика не
     зависела от план-мода.
  3. Найти весь мёртвый код/мёртвые пути, которые можно удалить: формулировки о
     несуществующих инструментах, недостижимые ветви потока, проверки/команды, которые
     нельзя выполнить, устаревшие инструкции оператору.
  4. Для каждого найденного места — сформулировать точное исправление (что удалить,
     чем заменить), чтобы владелец мог запустить отдельную implement-задачу.

  ОТДЕЛЬНАЯ ПОДЗАДАЧА А — инструкции оператору вне carriers фабрики.
  Те же мёртвые упоминания plan mode есть не только в трёх файлах внутри .agents/, но и в
  текстах, которые задают поведение оператора и агента:
    - AGENTS.md (проектные инструкции фабрики: описание фазы утверждения плана и любые
      упоминания EnterPlanMode/план-мода как рабочей механики),
    - .agents/README.md (руководство по эксплуатации фабрики: описание hitl-режима и
      утверждения плана).
  Нужно: найти там все такие места (файл:строка), определить, что из них мертво, что
  требует переписывания под фактический гейт утверждения (план-файл + явный вопрос), и
  включить в тот же follow-up файл задач. Проверить заодно согласованность формулировок
  между AGENTS.md, .agents/README.md, .agents/agents/code-factory.md и SKILL.md, чтобы не
  получилось «поправили в одном месте, осталось в другом».

  ОТДЕЛЬНАЯ ПОДЗАДАЧА Б — пробел в валидации: почему мёртвая ветка проскочила.
  scripts/check_factory_rules.py сверяет ТОЛЬКО блоки `factory-rule` (их побайтовое
  совпадение с references/factory-rules.md); формулировки вне этих блоков — например,
  описание узла I в flowchart SKILL.md, упоминания в code-factory.md и planning-guide.md —
  никакой проверкой не покрыты, поэтому нынешняя мёртвая ветка и проскочила незамеченной.
  Нужно:
    - инвентаризировать, какие классы утверждений о потоке/инструментах остаются вне
      factory-rule-блоков (описание узлов flowchart, порядок шагов, имена инструментов,
      режимы и флаги CLI);
    - предложить детерминированную проверку (по аналогии с существующими: test_prompt_structure.py
      уже разбирает flowchart SKILL.md как граф, test_flow_contracts.py — связность;
      можно расширить их или добавить проверку «инструмент существует в текущем CLI»);
    - проверить, не является ли эта проверка ложно-зелёной: то есть действительно ли она
      падает на текущем дереве (оно содержит EnterPlanMode) и проходит на исправленном;
    - оформить как отдельную задачу в follow-up файле: и саму проверку, и список носителей,
      которые ей должны подчиняться.

  ВАЖНО (review-report-only): этот прогон НИЧЕГО не меняет в продукте — только отчёт
  .code-factory/logs/code-review.md + .code-factory/report.md и файл follow-up задач
  .code-factory/review/fix-tasks.yaml (review_followup_task.py), который владелец запустит
  как отдельную implement-задачу. Все критерии с verify: обязаны выполняться на
  НЕИЗМЕНЁННОМ дереве.

user_story: |
  Я как владелец хочу, чтобы документация и поток фабрики описывали только те инструменты и
  режимы, которые реально существуют в моём Kimi Code, чтобы фабрика не деградировала молча
  после очередного обновления CLI, а мёртвые инструкции были удалены и заменены рабочими.

acceptance_criteria:
  - criterion: "Отчёт ревью .code-factory/logs/code-review.md составлен и содержит все найденные мёртвые пути/упоминания несуществующих инструментов с указанием файл:строка."
    verify: "python -c \"import pathlib,sys; p=pathlib.Path('.code-factory/logs/code-review.md'); t=p.read_text(encoding='utf-8') if p.is_file() else ''; sys.exit(0 if len(t)>500 and 'EnterPlanMode' in t and '.md:' in t else 1)\""

  - criterion: "Файл follow-up задач .code-factory/review/fix-tasks.yaml сгенерирован (review_followup_task.py) и содержит задачи на удаление/замену мёртвых инструкций."
    verify: "python -c \"import pathlib,sys; p=pathlib.Path('.code-factory/review/fix-tasks.yaml'); t=p.read_text(encoding='utf-8') if p.is_file() else ''; sys.exit(0 if 'EnterPlanMode' in t and ('task_type: implement' in t or 'title:' in t) else 1)\""

  - criterion: "Итоговый отчёт .code-factory/report.md записан и ссылается на ревью и follow-up файл."
    verify: "python -c \"import pathlib,sys; p=pathlib.Path('.code-factory/report.md'); t=p.read_text(encoding='utf-8') if p.is_file() else ''; sys.exit(0 if 'run_id' in t and ('code-review' in t or 'fix-tasks' in t) else 1)\""

  - criterion: "Ни один исходный файл продукта не изменён этим прогоном (review-report-only)."
    verify: "git -C . diff --quiet HEAD -- . ':!.code-factory' ':!memory' ':!.agents/skills/code-factory/scripts'"

  - criterion: "Подзадача А: в отчёте есть отдельный раздел о носителях вне .agents/skills и .agents/agents — найдены все упоминания plan mode/EnterPlanMode в AGENTS.md и .agents/README.md с указанием файл:строка."
    verify: "python -c \"import pathlib,sys,re; p=pathlib.Path('.code-factory/logs/code-review.md'); t=p.read_text(encoding='utf-8') if p.is_file() else ''; sys.exit(0 if 'AGENTS.md' in t and '.agents/README.md' in t and re.search(r'AGENTS\\.md:\\d+', t) else 1)\""

  - criterion: "Подзадача Б: в отчёте разобран пробел валидации — какие формулировки вне factory-rule-блоков не покрыты check_factory_rules.py, и предложена детерминированная проверка с указанием, падает ли она на текущем дереве."
    verify: "python -c \"import pathlib,sys; p=pathlib.Path('.code-factory/logs/code-review.md'); t=p.read_text(encoding='utf-8') if p.is_file() else ''; sys.exit(0 if 'check_factory_rules' in t and ('factory-rule' in t) and ('test_flow_contracts' in t or 'test_prompt_structure' in t) else 1)\""

business_tests:
  - scenario: "Владелец читает отчёт ревью и видит точный список мест, где фабрика ссылается на несуществующий в текущем CLI инструмент"
    config: "репозиторий фабрики в текущем состоянии, Kimi Code 2.4.1"
    expected_results: "в отчёте есть запись про EnterPlanMode с тремя файлами-носителями (SKILL.md, code-factory.md, planning-guide.md), и follow-up файл содержит задачу на их правку"

commit_exclude:
  - "materials/**"
  - "**/.env*"
  - "**/*credentials*"
  - "**/*.pem"
  - "**/*.key"

models:
  analyzer: kimi-code/k3.1-pro
  planner: kimi-code/k3.1-pro
  coder: deepseek-flash
  tester: deepseek-flash
  reviewer: kimi-code/k3.1-pro
  diagnostician: kimi-code/k3.1-pro
  advisor: deepseek-flash
  documenter: deepseek-flash
