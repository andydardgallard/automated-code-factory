  - "task_*.yaml"
  - "task-*.yaml"
  - ".kimi-code/local.toml"
  - "**/.env*"
  - "**/*credentials*"
  - "**/*.secret.json"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.whl"
  - "**/chrome-profile*/**"
  - "**/*.heapsnapshot"

