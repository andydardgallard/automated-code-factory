  ## major (16)

  1. .agents/skills/code-factory/scripts/evidence_ledger.py:86 — Evidence files outside --repo are accepted and retained under their external spelling instead of being rejected, despite
     detail:
        Evidence files outside --repo are accepted and retained under their external
        spelling instead of being rejected, despite the contract requiring
        repository-relative evidence scopes. quote: return path.as_posix() fix:
        Validate every --files entry as a plain repository-relative path and reject
        absolute, traversal and symlink-resolved external paths during sign and stamp.
  2. .agents/skills/code-factory/scripts/farukon_mcp.py:1280 — Farukon --target is confined but --out is merely joined to the repository and never containment-checked, so traversal, a
     detail:
        Farukon --target is confined but --out is merely joined to the repository and
        never containment-checked, so traversal, absolute paths or symlink escapes can
        write probe results outside the project. quote: path = repo_root / path fix:
        Apply the same resolved-path containment enforcement to --out as to --target
        before writing the probe JSON.
  3. .agents/skills/code-factory/scripts/gate_all.py:218 — The --out record path accepts absolute paths and unresolved traversal, allowing the aggregate gate to write its record o
     detail:
        The --out record path accepts absolute paths and unresolved traversal,
        allowing the aggregate gate to write its record outside the resolved
        repository in violation of run path confinement. quote: return path if
        path.is_absolute() else root / path fix: Resolve --out through the nearest
        existing ancestor and require it to remain inside --repo before creating or
        replacing the record.
  4. .agents/skills/code-factory/scripts/manifest.py:0 — A stale manifest.json from a finished run blocks the next run's manifest init
     detail:
        manifest.py init refuses to start when a manifest already exists, and the
        finish flow never removes or archives the manifest — so a run that follows a
        completed run is BLOCKED until the stale file is moved aside by hand, and the
        stale manifest's audit then reports DRIFT for the previous run's
        post-acceptance writes. Observed live in run 20261104-b5b601f6: manifest.json
        of run 20261103-8e939171 (59 files) blocked init and failed the phase-Y
        manifest-audit with 11 drift problems. quote: raise Blocked(f"{path} already
        lists {entries} file(s): a manifest is created ONCE per " fix: at finish,
        archive the run's manifest (e.g. manifest.<run_id>.json) or make init accept a
        stale manifest whose run_id differs from the current run after archiving it;
        add a two-runs-in-sequence regression test.
  5. .agents/skills/code-factory/scripts/skill_base.py:811 — --timeout accepts negative and non-finite floats without purpose-fitted validation
     detail:
        --timeout accepts negative and non-finite floats without purpose-fitted
        validation; downstream integer conversion or subprocess timeout handling can
        raise an uncaught ValueError instead of the documented controlled error.
        quote: parser.add_argument("--timeout", type=float,
        default=FETCH_TIMEOUT_SECONDS, metavar="SECONDS", help=f"Overall fetch time
        limit (default: {FETCH_TIMEOUT_SECONDS:g})") fix: Require a finite timeout
        greater than zero (and validate --max-bytes as a positive integer) before any
        transfer, returning a usage error for invalid values.
  6. .agents/skills/code-factory/scripts/test_business_tester_flow.py:441 — The evidence validator converts covered scenario IDs to a set and never rejects duplicate breakage entries, contrary to
     detail:
        The evidence validator converts covered scenario IDs to a set and never
        rejects duplicate breakage entries, contrary to its
        one-breakage-per-broken-scenario contract and allowing misleading duplicate
        evidence. quote: covered_ids = {c for c in covered if isinstance(c, str)} for
        scenario_id in sorted(broken - covered_ids): fix: Require unique scenario IDs
        and exactly one breakage per broken scenario, with a duplicate-breakage
        mutation test.
  7. .agents/skills/code-factory/scripts/test_check_english_only.py:421 — When git is unavailable, every substantive repository test is skipped but the suite still completes successfully after o
     detail:
        When git is unavailable, every substantive repository test is skipped but the
        suite still completes successfully after only the help test, producing vacuous
        green evidence. quote: if shutil.which("git") is None: print("SKIP - git is
        not on PATH: every repository case is skipped") cases = [("help", check_help)]
        fix: Return a distinct failure/skip status that cannot be consumed as PASS
        when repository cases did not run, or provision git as a required test
        dependency.
  8. .agents/skills/code-factory/scripts/test_check_translation_structure.py:425 — The translation-structure suite likewise reports overall success after skipping all behavioral cases when git is missing
     detail:
        The translation-structure suite likewise reports overall success after
        skipping all behavioral cases when git is missing, so its sibling verification
        can pass without testing translation behavior. quote: if shutil.which("git")
        is None: print("SKIP - git is not on PATH: every repository case is skipped")
        cases = [("help", check_help)] fix: Do not return success when the behavioral
        matrix was skipped; fail clearly or expose a non-pass skip status to the
        acceptance runner.
  9. .agents/skills/code-factory/scripts/test_flow_contracts.py:1100 — The adversarial-branch write guard checks only a direct edge to `M`, although its contract says the branch may never rea
     detail:
        The adversarial-branch write guard checks only a direct edge to `M`, although
        its contract says the branch may never reach a write node. An indirect path
        such as `BTR0 --> X --> M` therefore passes the test. quote: for write_node in
        WRITE_NODES: if (middle, write_node) in edges: problems.append(f"{SKILL}:1:
        the {middle} branch leads straight into the write node " fix: Compute
        transitive reachability from each adversarial middle node and reject every
        path to every write node, not just a direct edge. Add a vaccination fixture
        with an intermediate node between the adversarial branch and `M`.
  10. .agents/skills/code-factory/scripts/test_gen_code_changes_report.py:99 — The real report-generation case omits `env=LEGACY_ENV`, so the promised cp1251 torture coverage does not exercise genera
     detail:
        The real report-generation case omits `env=LEGACY_ENV`, so the promised cp1251
        torture coverage does not exercise generation of the actual non-ASCII
        report—the main path where the encoding regression mattered. quote: res =
        run("--repo", str(repo), "--commit", "HEAD", "--out", str(report), "--run-id",
        "test-1") fix: Run this report-generation invocation with `env=LEGACY_ENV`,
        retaining the non-ASCII content assertions and checking both output streams
        for encoding failures.
  11. .agents/skills/code-factory/scripts/test_merge_findings.py:192 — The test explicitly blesses an overall `approve` for a shard containing an active major finding, allowing an inconsisten
     detail:
        The test explicitly blesses an overall `approve` for a shard containing an
        active major finding, allowing an inconsistent shard response to become a
        false-green merged review instead of being rejected or escalated. quote:
        major_only = mf.merge([mf.load_shard_file(write_findings( root, "major.json",
        "shard-major", "approve", [finding("nit", "a.py", 1, "cosmetic", ""),
        finding("major", "b.py", 2, "big", "")]))]) expect(major_only["verdict"] ==
        "approve", f"major/nit alone must not change the merged verdict:
        {major_only['verdict']}") fix: Reject a shard whose active critical/major
        findings conflict with its `approve` verdict, or derive the merged verdict
        directly from active critical/major findings. Change this fixture to assert
        non-approval, while preserving the separate handling of refuted findings.
  12. .agents/skills/code-factory/scripts/test_no_role_substitution.py:89 — The claimed EVERY-task-named-role provider-stop coverage hard-codes only legacy delegation nodes
     detail:
        The claimed EVERY-task-named-role provider-stop coverage hard-codes only
        legacy delegation nodes; `business_tester` and `supervisor` receive
        registry/card checks but no assertion that their delegation nodes reach `MS`,
        so their provider-error routing can disappear without a failing test. quote:
        FAILURE_NODE = "MS" FAILURE_FROM = ("M", "E", "SC", "F", "PC", "N", "Q", "S",
        "CR", "CR0", "DG", "ADV", "DOC2", "SA") fix: Derive the required
        provider-failure edge coverage from the role registry and the flow's
        delegation table, including every business-tester delegation node and the
        actual supervisor delegation site. Add a negative probe that removes one of
        those edges and require the guard to fail.
  13. .agents/skills/code-factory/scripts/test_task_graph.py:96 — The purported status-race test is entirely sequential: it claims once and then claims again
     detail:
        The purported status-race test is entirely sequential: it claims once and then
        claims again. It cannot detect a check-then-write race in which two workers
        both observe `pending` and both successfully claim the task. quote: # 5. claim
        -> in_progress; a second claim is refused (the owner is fixed once). res =
        run("claim", *base, "--id", "task_01", "--owner", "coder") fix: Add a
        synchronized concurrent probe that starts two independent claim processes
        against the same pending task, asserts exactly one succeeds and the other is
        refused, and verifies one persisted owner and one pending-to-in_progress
        transition.
  14. .agents/skills/code-factory/scripts/test_windows_scripts.py:705 — The launcher vaccination check silently returns successfully when the pre-fix commit or source cannot be obtained, so mi
     detail:
        The launcher vaccination check silently returns successfully when the pre-fix
        commit or source cannot be obtained, so missing/shallow git history turns the
        required pre-fix proof into a pass. quote: for rel in (SH_NAME, PS1_NAME):
        base = pre_guard_base(rel) if base is None: return old =
        git_show(f"{base}:{rel}") if old is None: return fix: Fail explicitly when
        either pre-fix source is unavailable instead of returning; the test must not
        report a successful vaccination check without executing the negation probe for
        both deployers.
  15. .agents/skills/code-factory/scripts/verify_acceptance.py:148 — A negative --timeout silently disables the timeout even though the CLI documents only zero as unlimited, allowing a mist
     detail:
        A negative --timeout silently disables the timeout even though the CLI
        documents only zero as unlimited, allowing a mistyped value to remove the
        hung-command guard. quote: stdout, stderr = proc.communicate(timeout=timeout
        if timeout > 0 else None) fix: Reject negative timeout values during argument
        validation while preserving zero as the documented unlimited value, and add a
        negative-value CLI regression test.
  16. .example.task.yaml:176 — The example task file's models block lists only 8 of the 15 factory roles
     detail:
        The commented-out models matrix in the shipped example names analyzer,
        planner, coder, gui_expert, farukon_expert, tester, diagnostician, reviewer —
        but the role registry (model_matrix.py ROLES) has 15 roles: business_tester,
        refactorer, supervisor, advisor, documenter, security_auditor and
        skill_manager are missing. A task copied from the example silently leaves
        those roles to the default matrix; this very review run hit that gap
        (business_tester/farukon_expert had to be pinned mid-flight after the
        resolver's exit 1). quote: # reviewer: deepseek-v4-pro fix: list every ROLES
        entry in the example with a one-line comment and its generator/judge side,
        matching model_matrix.py's registry; add a test asserting the example covers
        all registered roles.

  ## minor (4)

  1. .agents/skills/code-factory/scripts/test_manifest.py:445 — The test assumes `chmod 0444` makes atomic replacement fail
     detail:
        The test assumes `chmod 0444` makes atomic replacement fail. On POSIX,
        replacement is controlled by the parent directory's permissions rather than
        the destination file's mode, so `os.replace` can succeed and the mandated exit
        2 is platform-dependent. quote: os.chmod(path, 0o444) try: res = run("add",
        "--repo", str(frozen), "--created", "src/new.py") fix: Use a deterministic
        failure such as a directory at the destination path, or explicitly branch on
        the platform's observed replacement semantics instead of requiring a
        chmod-based failure on POSIX.
  2. .agents/skills/code-factory/scripts/test_permit_gate.py:532 — This repeats the Windows-only assumption that a read-only destination cannot be atomically replaced
     detail:
        This repeats the Windows-only assumption that a read-only destination cannot
        be atomically replaced. A writable POSIX parent directory permits replacement
        despite mode `0444`, making the expected failure non-portable. quote:
        os.chmod(permits_file, 0o444) try: res = run("add", "--repo", str(frozen),
        "--permit-id", "P2", "--task-id", "task_09", fix: Replace the chmod-based
        assertion with a portable forced write failure, or accept the
        successful-replacement branch on POSIX while continuing to verify atomicity
        and temp-file cleanup.
  3. .agents/skills/code-factory/scripts/version_manager.py:141 — CHANGELOG synchronization prepends whenever the top version merely differs, not only when it is older as documented
     detail:
        CHANGELOG synchronization prepends whenever the top version merely differs,
        not only when it is older as documented; a legitimate downgrade or manual set
        to an older version therefore puts releases out of order. quote: if m.group(1)
        != v: lines[i:i] = [f"## [{v}] — {date}", ""] fix: Compare parsed semantic
        versions and either reject a downgrade or insert the older release in its
        proper position; add a test whose top CHANGELOG section is newer than the
        version being synced.
  4. prepare_factory.sh:184 — The bash deployer still interpolates the complete multi-line memory-check output, so legacy warnings can flood the conso
     detail:
        The bash deployer still interpolates the complete multi-line memory-check
        output, so legacy warnings can flood the console and bury the readiness
        report; the PowerShell parity fix did not cover this path. quote: info "
        Project memory: in place — $MEM_CHECK_OUT" fix: Derive a one-line verdict plus
        WARN count as in prepare_factory.ps1 and use it here and in the mixed/other
        warning branches, retaining the full output only for parsing.

