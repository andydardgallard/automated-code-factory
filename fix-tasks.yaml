  1. .agents/agents/sub-agents/supervisor.md:3 — Owner requirement: the supervisor must be an autonomous background watchdog, not a synchronous per-delegation permit clerk
     detail:
        Business requirement (owner, 20261104-b5b601f6): the supervisor was expected
        to watch the factory autonomously in the background — tracking in real time
        that every agent follows the workflow (the pain behind VIOLATIONS_REPORT.md,
        where agents broke strict rules and left the workflow) — and to stop and
        correct misbehaving agents by itself. Instead the shipped design is a
        synchronous permit judge: EVERY budgeted or scope-touching delegation blocks
        on a verdict, and the process turned semi-manual (this run: 17 permits, 3
        supervisor spawns, repeated owner decisions). The user experience regressed
        instead of improving. quote: description: Read-only gatekeeper — review a
        proposed delegation's permit against the rulebook and the approved plan and
        return an allow|deny VERDICT with evidence fix: redesign the supervisor as a
        run-long background watchdog: (a) launched once at run start as a background
        agent for the whole run, not per delegation; (b) monitors the session wire and
        .code-factory state CONTINUOUSLY through the deterministic zero-token scanners
        (delegation_gate/permit_gate/action_gate audits, gate records, pipeline
        counters) on a schedule; (c) spends LLM tokens ONLY on flagged anomalies — a
        deterministic scan that finds nothing costs no tokens; (d) on a violation it
        can STOP the run (records a blocking deny that no phase gate may pass) and
        route correction to the violating role with the rulebook citation; (e) the
        synchronous per-delegation verdict is retired or reduced to the plan-touching
        set, and the bootstrap circularity (the watchdog cannot permit itself) is
        resolved by the watchdog being launched under the run's own authority; (f)
        hard backstops stay deterministic (finish audits), the watchdog is the
        real-time layer on top. Feasibility note for the planner: real call-time
        interception does not exist in the CLI — the honest design is continuous
        watchdog + blocking phase gates, documented as such.
