title: "Fix incorrect operation of SYMI_Ch_SMA_up_lmt strategy for instruments with fractional prices"
repo_path: ./repo/repo
description: |
  ## Context
  The FarukonAlgoTradingPlatform uses a trading strategy implemented in the file 
  `SYMI_Ch_SMA_up_lmt.rs` (SYMI_Ch_SMA_up_lmt) and lib.rs (for compilation). The strategy generates signals 
  for entering positions (LONG/SHORT) and exiting positions (EXIT) based on the crossover of a price 
  channel built using moving averages of highs and lows, taking into account the channel width 
  and the position of the SMA relative to the boundaries.
  
  ## Problem Description
  When running the strategy on historical data, the following behavior is observed:
  
  - **For instrument Si-3.23.txt** (futures on USD/RUB exchange rate, integer prices in the range ~79000): 
    the strategy works correctly — generates trading signals, opens and closes positions, 
    forms the expected equity curve.
  
  - **For instrument CNY-3.23.txt** (futures on Chinese Yuan exchange rate, fractional prices in the range ~11.7): 
    the strategy works incorrectly — trading signals are either not generated at all, or are generated 
    abnormally, which leads to absence of trading operations or unprofitable trading that does not correspond 
    to the strategy logic.
  
  ## Behavior Analysis
  Input data for instruments differs fundamentally in price magnitude:
  
  - Si-3.23.txt: prices in the range of 79,000 — 79,600, range (high - low) per bar — tens and hundreds of points.
  - CNY-3.23.txt: prices in the range of 11.70 — 11.72, range (high - low) per bar — hundredths and thousandths of a point.
  
  The key strategy parameter — `width_channel` — sets the threshold value for the price channel width 
  (difference between upper and lower boundaries), at which entry into a position is allowed. Channel width 
  is calculated as the difference between the maximum and minimum values of moving averages 
  built on high and low respectively.
  
  Presumed business logic problem: when calculating channel width for instrument CNY-3.23.txt, 
  absolute values of the difference between channel boundaries are in the order of 0.01–0.05. 
  When converting this value to an integer type (truncating the fractional part), the channel width 
  becomes zero or loses significant precision. As a result:
  
  - The condition "channel width is less than the threshold value width_channel" is trivially satisfied 
    (0 < width_channel) for any reasonable threshold, or conversely, the channel width filtering logic 
    stops performing its business function — filtering out moments with excessively wide 
    or abnormally narrow channels.
  - Position entry signals are either generated on every bar without filtering, or are not 
    generated at all due to violation of the balance of entry conditions.
  
  Additionally, it is necessary to check:
  - Whether all numeric comparisons in the strategy logic work correctly with small fractional values 
    (channel boundaries, "lustra" — internal offsets from channel boundaries, SMA values).
  - Whether precision is lost when calculating indicators (highest, lowest, sma) for sequences 
    with small value dispersion.
  - Whether the position sizing mechanism (pos_sizer) works correctly for instruments 
    with fractional prices and small tick value.
  - Whether problems arise when comparing prices (close, high, low) with channel boundaries due to 
    floating-point representation errors.
  
  ## Expected Result
  The SYMI_Ch_SMA_up_lmt strategy should work equally correctly for instruments with any 
  price magnitude — both for "expensive" instruments (Si-3.23.txt with integer values ~79000) and for 
  "cheap" instruments (CNY-3.23.txt with fractional values ~11.7). The channel width filtering logic and all 
  other entry/exit conditions should maintain their meaning regardless of the absolute price level 
  of the instrument.
  
  ## File and Instrument References
  - Repository: ./repo
  - Strategy file: `SYMI_Ch_SMA_up_lmt.rs` and lib.rs
  - Instrument on which the strategy works correctly: **Si-3.23.txt** (USD/RUB futures)
  - Instrument on which the strategy works incorrectly: **CNY-3.23.txt** (Chinese Yuan futures)

priority: high

acceptance_criteria:
  - Root cause of incorrect SYMI_Ch_SMA_up_lmt strategy operation for CNY-3.23.txt instrument is identified and fixed
  - Strategy generates meaningful trading signals (LONG/SHORT/EXIT) for CNY-3.23.txt instrument
  - Strategy behavior for Si-3.23.txt instrument has not regressed — run results match previous results
  - Automated tests are written verifying strategy operation on instruments with integer and fractional prices
  - All existing platform tests pass (cargo test)
  - Strategy documentation is updated with description of limitations and features of working with instruments of different price ranges
  - Changes are committed to a separate branch with a meaningful name related to the task number